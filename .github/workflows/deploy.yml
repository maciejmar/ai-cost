# CD — push na master: CI → obrazy do GHCR → wdrożenie przez SSH na 95.158.64.196 (https://ai-cost.webaby.io).
# Ręczne uruchomienie z polem `tag` wdraża istniejący obraz bez budowania (np. rollback).
#
# Wymagane w Settings → Environments → production:
#   secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY, DEPLOY_KNOWN_HOSTS
#   opcjonalnie: DEPLOY_JUMP_HOST (host pośredni SSH, gdy serwer docelowy nie ma publicznego SSH)
#   variables: DEPLOY_PATH (katalog na serwerze z plikiem .env.agents, np. /opt/agentic-ai-os)
name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      tag:
        description: "Wdróż istniejący tag obrazu (pełny SHA commita) zamiast budować nowy"
        required: false
        default: ""

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  ci:
    if: inputs.tag == ''
    uses: ./.github/workflows/ci.yml

  images:
    name: Publikacja ${{ matrix.image }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - image: gateway
            context: .
            file: gateway/Dockerfile
          - image: gateway-ui
            context: gateway-ui
            file: gateway-ui/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          build-args: |
            GATEWAY_INTERNAL_URL=http://gateway:8090
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:latest
          # Pakiet GHCR dziedziczy uprawnienia repo
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  deploy:
    name: Wdrożenie na ai-cost.webaby.io
    needs: images
    # Uruchom po udanym buildzie albo przy ręcznym wdrożeniu istniejącego tagu
    if: >-
      always() &&
      (needs.images.result == 'success' || (inputs.tag != '' && needs.images.result == 'skipped'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://ai-cost.webaby.io
    permissions:
      contents: read
      packages: read
    env:
      TAG: ${{ inputs.tag || github.sha }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}

      - name: Konfiguracja SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          USER: ${{ secrets.DEPLOY_USER }}
          JUMP: ${{ secrets.DEPLOY_JUMP_HOST }}
        run: |
          test -n "$HOST" && test -n "$USER" && test -n "$SSH_KEY" && test -n "$KNOWN_HOSTS" && test -n "$DEPLOY_PATH" \
            || { echo "::error::Brak sekretów DEPLOY_* lub zmiennej DEPLOY_PATH w środowisku production"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          # Bez StrictHostKeyChecking=no — klucze hostów muszą być w DEPLOY_KNOWN_HOSTS
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          {
            echo "Host target"
            echo "  HostName $HOST"
            echo "  User $USER"
            if [ -n "$JUMP" ]; then echo "  ProxyJump $JUMP"; fi
            echo "Host *"
            echo "  IdentityFile ~/.ssh/deploy"
            echo "  IdentitiesOnly yes"
            echo "  ServerAliveInterval 30"
          } > ~/.ssh/config

      - name: Wysłanie plików wdrożenia
        run: |
          # Tylko to, czego potrzebuje compose na serwerze; .env.agents zostaje na serwerze
          # shellcheck disable=SC2029  # ścieżka celowo rozwijana po stronie runnera
          tar czf - docker-compose.webaby.yml database monitoring deploy \
            | ssh target "mkdir -p '$DEPLOY_PATH' && tar xzf - -C '$DEPLOY_PATH'"

      - name: Logowanie serwera do GHCR (token ważny tylko w trakcie joba)
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REGISTRY_USER: ${{ github.actor }}
        run: |
          # shellcheck disable=SC2029  # użytkownik celowo rozwijany po stronie runnera
          printf '%s' "$REGISTRY_TOKEN" | ssh target "docker login ghcr.io -u '$REGISTRY_USER' --password-stdin"

      - name: Wdrożenie (healthcheck + automatyczny rollback)
        run: |
          # shellcheck disable=SC2029  # ścieżka i tag celowo rozwijane po stronie runnera
          ssh target "IMAGE_PREFIX='$IMAGE_PREFIX' bash '$DEPLOY_PATH/deploy/deploy.sh' '$TAG'"

      - name: Wylogowanie serwera z GHCR
        if: always()
        run: ssh target "docker logout ghcr.io" || true

      - name: Podsumowanie
        if: success()
        run: |
          {
            echo "### Wdrożono \`$TAG\`"
            echo "- \`$IMAGE_PREFIX/gateway:$TAG\`"
            echo "- \`$IMAGE_PREFIX/gateway-ui:$TAG\`"
          } >> "$GITHUB_STEP_SUMMARY"
