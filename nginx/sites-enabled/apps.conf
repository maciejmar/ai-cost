# ─── Zmienne ─────────────────────────────────────────────────────────────────
# Zastąp lub ustaw jako zmienne środowiskowe przez envsubst:
#   WEBABY_WG_IP  = 10.10.0.2  (WireGuard IP serwera webaby)
#   GPU_WG_IP     = 10.10.0.3  (WireGuard IP serwera GPU)

# ─── Office Assistant ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name office-assistant.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/office-assistant.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/office-assistant.webaby.io/privkey.pem;

    limit_req zone=per_ip burst=50 nodelay;

    location / {
        proxy_pass http://10.10.0.2:4201;   # Angular frontend na webaby
    }

    location /api/ {
        proxy_pass http://10.10.0.2:3001/;  # Backend API na webaby
        proxy_read_timeout 120s;
    }
}

# ─── Webaby Shop ─────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name webaby-shop.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/webaby-shop.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webaby-shop.webaby.io/privkey.pem;

    limit_req zone=per_ip burst=50 nodelay;

    location / {
        proxy_pass http://10.10.0.2:4202;
    }

    location /api/ {
        proxy_pass http://10.10.0.2:3002/;
    }
}

# ─── DocuFlow ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name docuflow.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/docuflow.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/docuflow.webaby.io/privkey.pem;

    limit_req zone=per_ip burst=50 nodelay;

    location / {
        proxy_pass http://10.10.0.2:4203;
    }

    location /api/ {
        proxy_pass http://10.10.0.2:3003/;
        proxy_read_timeout 180s;    # DocuFlow może mieć długie operacje
    }
}

# ─── Dashboard (panel agentów) ───────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name portal-ai.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/portal-ai.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/portal-ai.webaby.io/privkey.pem;

    # Dashboard dostępny tylko przez VPN lub whitelist IP
    # allow 10.10.0.0/24;  # WireGuard subnet
    # deny all;

    location / {
        proxy_pass http://10.10.0.2:4200;   # Angular dashboard frontend
    }

    location /api/ {
        proxy_pass http://10.10.0.2:8080/;  # Dashboard FastAPI backend
    }

    location /ws/ {
        proxy_pass http://10.10.0.2:8080/ws/;
        proxy_read_timeout 3600s;            # Długi timeout dla WebSocket
    }
}

# ─── WhatsApp Webhook ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name webhook.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/webhook.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhook.webaby.io/privkey.pem;

    # Tylko Twilio IPs (lista aktualna na: https://www.twilio.com/docs/ips)
    # allow 54.172.60.0/23;
    # allow 54.244.51.0/24;
    # deny all;

    location /whatsapp/ {
        proxy_pass http://10.10.0.2:8011/;
        limit_req zone=per_ip burst=10 nodelay;
    }
}

# ─── Grafana ─────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name grafana.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/grafana.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/grafana.webaby.io/privkey.pem;

    allow 10.10.0.0/24;   # Tylko WireGuard
    deny all;

    location / {
        proxy_pass http://10.10.0.2:3001;
    }
}

# ─── Keycloak ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name auth.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/auth.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auth.webaby.io/privkey.pem;

    location / {
        proxy_pass http://10.10.0.2:8180;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}

# ─── Langfuse ────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name langfuse.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/langfuse.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/langfuse.webaby.io/privkey.pem;

    allow 10.10.0.0/24;
    deny all;

    location / {
        proxy_pass http://10.10.0.3:3000;
    }
}

# ─── AIGateway-X (bramka AI + dashboard) ─────────────────────────────────────
# Agenci na webaby wołają bramkę bezpośrednio (http://gateway:8090/v1) —
# ten vhost jest dla zewnętrznych aplikacji i dashboardu.
limit_req_zone $http_authorization zone=gw_key:10m rate=600r/m;   # per klucz agx_…

server {
    listen 443 ssl;
    server_name gateway.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/gateway.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gateway.webaby.io/privkey.pem;

    client_max_body_size 32m;   # prompty z obrazami (base64)

    # OpenAI-kompatybilne proxy — streaming SSE bez buforowania
    location /v1/ {
        limit_req zone=gw_key burst=100 nodelay;
        proxy_pass http://10.10.0.2:8090;
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection "";
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API dashboardu (logowanie, aplikacje, koszty)
    location /api/ {
        limit_req zone=per_ip burst=60 nodelay;
        proxy_pass http://10.10.0.2:8090;
    }

    # Dashboard Next.js
    location / {
        proxy_pass http://10.10.0.2:3100;
    }
}
