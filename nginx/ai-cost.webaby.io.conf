# AIGateway-X — ai-cost.webaby.io (systemowy nginx na 95.158.64.196, ta sama maszyna co kontenery)
#
# Instalacja (jednorazowo, szczegóły: deploy/README.md):
#   sudo certbot certonly --nginx -d ai-cost.webaby.io
#   sudo cp nginx/ai-cost.webaby.io.conf /etc/nginx/sites-available/ai-cost.webaby.io
#   sudo ln -s /etc/nginx/sites-available/ai-cost.webaby.io /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Kontenery publikują porty tylko na 127.0.0.1. Porty muszą się zgadzać z .env.agents na serwerze:
#   GATEWAY_HOST_PORT=8190      gateway    — /v1 (proxy LLM) i /api (dashboard API)
#   GATEWAY_UI_HOST_PORT=3190   gateway-ui — dashboard Next.js
# (8090 na webaby zajmuje inny kontener)

upstream aicost_gateway { server 127.0.0.1:8190; }
upstream aicost_ui      { server 127.0.0.1:3190; }

# Strefy z unikalnymi nazwami, żeby nie kolidować z konfiguracją innych aplikacji na serwerze
limit_req_zone $binary_remote_addr  zone=aicost_ip:10m  rate=120r/m;
limit_req_zone $http_authorization  zone=aicost_key:10m rate=600r/m;   # per klucz agx_…

server {
    listen 80;
    listen [::]:80;
    server_name ai-cost.webaby.io;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;       # nginx 1.24 na serwerze — składnia sprzed `http2 on;`
    listen [::]:443 ssl http2;
    server_name ai-cost.webaby.io;

    ssl_certificate     /etc/letsencrypt/live/ai-cost.webaby.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ai-cost.webaby.io/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 32m;   # prompty z obrazami (base64)

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # OpenAI-kompatybilne proxy — streaming SSE bez buforowania, długie odpowiedzi modeli
    location /v1/ {
        limit_req zone=aicost_key burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://aicost_gateway;
        # Bez proxy_set_header tutaj — nadpisałby nagłówki Host/X-Forwarded-* z poziomu server
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # API dashboardu (logowanie, aplikacje, koszty)
    location /api/ {
        limit_req zone=aicost_ip burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://aicost_gateway;
    }

    # Dashboard Next.js
    location / {
        proxy_pass http://aicost_ui;
    }
}
