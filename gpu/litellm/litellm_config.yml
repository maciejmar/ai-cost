# LiteLLM — konfiguracja routingu modeli
# Jedyny punkt wejścia dla wszystkich agentów do LLM

model_list:

  # ─── Claude (primary) ─────────────────────────────────────
  - model_name: claude-opus-4
    litellm_params:
      model: anthropic/claude-opus-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-sonnet-4
    litellm_params:
      model: anthropic/claude-sonnet-4-20250514
      api_key: os.environ/ANTHROPIC_API_KEY

  - model_name: claude-haiku-4
    litellm_params:
      model: anthropic/claude-haiku-4-5-20251001
      api_key: os.environ/ANTHROPIC_API_KEY

  # ─── OpenAI (fallback) ────────────────────────────────────
  - model_name: gpt-4o
    litellm_params:
      model: openai/gpt-4o
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

  # ─── Ollama (cost-save / offline fallback) ────────────────
  - model_name: ollama-llama3-70b
    litellm_params:
      model: ollama/llama3.3:70b-instruct-q4_K_M
      api_base: http://ollama:11434

  - model_name: ollama-mistral
    litellm_params:
      model: ollama/mistral:7b
      api_base: http://ollama:11434

  # ─── Embeddings ───────────────────────────────────────────
  - model_name: text-embedding-local
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434

router_settings:
  routing_strategy: cost-based-routing
  num_retries: 3
  retry_after: 5
  fallbacks:
    - claude-opus-4: [gpt-4o, ollama-llama3-70b]
    - claude-sonnet-4: [gpt-4o-mini, ollama-llama3-70b]
    - claude-haiku-4: [gpt-4o-mini, ollama-mistral]

litellm_settings:
  # Tracing przez Langfuse
  success_callback: ["langfuse"]
  failure_callback: ["langfuse"]

  # Prompt caching dla Claude
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    password: os.environ/REDIS_PASSWORD

  # Bezpieczeństwo
  drop_params: true         # Ignoruj nieznane parametry
  set_verbose: false

  # Budżet
  max_budget: 500           # Miesięczny cap USD
  budget_duration: "1mo"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL    # PostgreSQL dla audit logu LiteLLM
